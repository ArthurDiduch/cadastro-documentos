services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadastro-documentos-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_PG_HOST: postgres
    ports:
      - "3050:3050"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cadastro-documentos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadastro_documentos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadastro_documentos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
